<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>深边AI Work · 浏览器演示页</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 40px; color: #1f2329; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #646a73; line-height: 1.7; max-width: 620px; }
    .row { margin-top: 20px; display: flex; gap: 10px; }
    input { padding: 9px 12px; border: 1px solid #d9dce1; border-radius: 8px; font-size: 14px; min-width: 220px; }
    button { padding: 9px 18px; border: 0; border-radius: 8px; background: #4d6bfe; color: #fff; font-size: 14px; cursor: pointer; }
    #out { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: #f2f3f5; font-family: Consolas, monospace; font-size: 13px; }
    .tag { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; background: #eef2ff; color: #4d6bfe; font-size: 12px; }
  </style>
</head>
<body>
  <h1>浏览器自动化演示</h1>
  <span class="tag">CDP · 系统 Edge · 零外部依赖</span>
  <p>
    这一页由受管浏览器打开。宿主用 Chrome DevTools Protocol 驱动系统自带的 Edge/Chrome，
    因此不需要安装 Playwright 或下载浏览器内核；模型侧的六个动作经由内核的 MCP 服务注册，
    每一次调用都要经过审批。
  </p>
  <div class="row">
    <input id="q" placeholder="输入点什么" value="">
    <button id="go" onclick="document.getElementById('out').textContent='已执行：' + document.getElementById('q').value">执行</button>
  </div>
  <div id="out">等待操作</div>
</body>
</html>
